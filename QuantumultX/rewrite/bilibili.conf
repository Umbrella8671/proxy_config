# Bilibili Plus Lite v2 — compact home navigation for Quantumult X
# Based on https://github.com/asjdf/bilibili-plus (GPL-3.0)
# Modified version: compact home navigation + splash/feed/live/mine and legacy dynamics.
# Excluded: video-detail & DynAll Protobuf rewrite, api.bilibili.com, manga and grpc MITM.
# IMPORTANT: Replace YOUR_GITHUB_USERNAME and YOUR_REPOSITORY_NAME after uploading.

# 旧版动态：移除话题和“最常访问”模块
^https?:\/\/api\.vc\.bilibili\.com\/topic_svr\/v1\/topic_svr url reject-dict
^https?:\/\/api\.vc\.bilibili\.com\/dynamic_svr\/v1\/dynamic_svr\/mix_uplist url reject-dict

# 首页推荐去广告（只匹配首页 index，不拦截 Story）
^https:\/\/app\.bilibili\.com\/x\/v2\/feed\/index\? url script-response-body https://raw.githubusercontent.com/Umbrella8671/proxy_config/refs/heads/main/QuantumultX/scripts/bilibili.js

# 直播页广告
^https?:\/\/api\.live\.bilibili\.com\/xlive\/app-room\/v1\/index\/getInfoByRoom url script-response-body https://raw.githubusercontent.com/Umbrella8671/proxy_config/refs/heads/main/QuantumultX/scripts/bilibili.js

# 旧版动态广告（不包括 gRPC DynAll）
^https?:\/\/api\.vc\.bilibili\.com\/dynamic_svr\/v1\/dynamic_svr\/dynamic_(history|new)\? url script-response-body https://raw.githubusercontent.com/Umbrella8671/proxy_config/refs/heads/main/QuantumultX/scripts/bilibili.js

# 开屏广告
^https?:\/\/app\.bilibili\.com\/x\/v2\/splash\/list url script-response-body https://raw.githubusercontent.com/Umbrella8671/proxy_config/refs/heads/main/QuantumultX/scripts/bilibili.js

# 首页导航精简（同时匹配旧 /tab 与新版 /tab/v2）
^https?:\/\/app\.bilibili\.com\/x\/resource\/show\/tab(?:\/v2)?(?:\?|$) url script-response-body https://raw.githubusercontent.com/Umbrella8671/proxy_config/refs/heads/main/QuantumultX/scripts/bilibili.js

# “我的”页面精简
^https?:\/\/app\.bilibili\.com\/x\/v2\/account\/mine url script-response-body https://raw.githubusercontent.com/Umbrella8671/proxy_config/refs/heads/main/QuantumultX/scripts/bilibili.js

# 故意使用明确域名，避免原规则 *.bilibili.com 与 grpc.biliapi.net 的广泛 MITM。
# 若 QX 其他模块/主配置仍加入了这些主机，需要另行移除，才会真正缩小 MITM 范围。
hostname = app.bilibili.com, api.live.bilibili.com, api.vc.bilibili.com
